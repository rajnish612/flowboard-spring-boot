services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-user}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d users"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761

  authservice:
    build: ./authservice
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-user}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      CLIENT_URI: http://localhost:3000
      GOOGLE_REDIRECT_URI: http://localhost:8081/login/oauth2/code/google
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

  workspaceservice:
    build: ./workspaceservice
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/workspace_service
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-user}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: http://eureka-server:8761/eureka/

  taskservice:
    build: ./taskservice
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/task_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-user}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: http://eureka-server:8761/eureka/
      WEBSOCKET_ALLOWED_ORIGINS: http://localhost:3000

  gateway:
    build: ./gateway
    ports:
      - "8081:8081"
    depends_on:
      eureka-server:
        condition: service_started
      authservice:
        condition: service_started
      workspaceservice:
        condition: service_started
      taskservice:
        condition: service_started
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: http://localhost:3000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8081
        VITE_WS_URL: ws://localhost:8083/ws
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started

volumes:
  postgres-data:
