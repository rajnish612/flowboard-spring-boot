services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-user}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d users"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka-server:
    build: ./eureka-server
    ports:
      - "${EUREKA_SERVER_PORT:-8761}:${EUREKA_SERVER_PORT:-8761}"
    environment:
      SERVER_PORT: ${EUREKA_SERVER_PORT:-8761}

  authservice:
    build: ./authservice
    ports:
      - "${AUTH_SERVICE_PORT:-8000}:${AUTH_SERVICE_PORT:-8000}"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_URL: ${AUTH_DB_URL:-jdbc:postgresql://postgres:5432/users}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-user}
      DB_DRIVER: ${DB_DRIVER:-org.postgresql.Driver}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in .env}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      CLIENT_URI: ${CLIENT_URI:-http://localhost:3000}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8081/login/oauth2/code/google}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}
      SERVER_PORT: ${AUTH_SERVICE_PORT:-8000}

  workspaceservice:
    build: ./workspaceservice
    ports:
      - "${WORKSPACE_SERVICE_PORT:-8082}:${WORKSPACE_SERVICE_PORT:-8082}"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      DB_URL: ${WORKSPACE_DB_URL:-jdbc:postgresql://postgres:5432/workspace_service}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-user}
      DB_DRIVER: ${DB_DRIVER:-org.postgresql.Driver}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      SERVER_PORT: ${WORKSPACE_SERVICE_PORT:-8082}

  taskservice:
    build: ./taskservice
    ports:
      - "${TASK_SERVICE_PORT:-8083}:${TASK_SERVICE_PORT:-8083}"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
    environment:
      DB_URL: ${TASK_DB_URL:-jdbc:postgresql://postgres:5432/task_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-user}
      DB_DRIVER: ${DB_DRIVER:-org.postgresql.Driver}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:19092,kafka-2:19092}
      SERVER_PORT: ${TASK_SERVICE_PORT:-8083}

  notificationservice:
    build: ./notificationservice
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:${NOTIFICATION_SERVICE_PORT:-8084}"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_started
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
    environment:
      DB_URL: ${NOTIFICATION_DB_URL:-jdbc:postgresql://postgres:5432/notification_db}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-user}
      DB_DRIVER: ${DB_DRIVER:-org.postgresql.Driver}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      WEBSOCKET_ALLOWED_ORIGINS: ${WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:19092,kafka-2:19092}
      SERVER_PORT: ${NOTIFICATION_SERVICE_PORT:-8084}

  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-8081}:${GATEWAY_PORT:-8081}"
    depends_on:
      eureka-server:
        condition: service_started
      authservice:
        condition: service_started
      workspaceservice:
        condition: service_started
      taskservice:
        condition: service_started
    environment:
      EUREKA_URL: ${EUREKA_URL:-http://eureka-server:8761/eureka/}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SERVER_PORT: ${GATEWAY_PORT:-8081}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
        VITE_TASK_WS_URL: ${VITE_TASK_WS_URL:-ws://localhost:8081/ws}
        VITE_NOTIFICATION_WS_URL: ${VITE_NOTIFICATION_WS_URL:-ws://localhost:8081/ws}
    ports:
      - "3000:80"
    depends_on:
      gateway:
        condition: service_started
  kafka-1:
    image: apache/kafka:4.3.1
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-1:19092,PLAINTEXT_HOST://localhost:29092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

  kafka-2:
    image: apache/kafka:4.3.1
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "39092:9092"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"

      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092"

      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka-2:19092,PLAINTEXT_HOST://localhost:39092"

      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093"

      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_NUM_PARTITIONS: 3

      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"

volumes:
  postgres-data:
